<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Normalize window.fetch getter/setter so browser extension interceptors can assign to it safely
      try {
        const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
        let _activeFetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _activeFetch;
          },
          set(interceptor) {
            _activeFetch = typeof interceptor === 'function' ? interceptor : originalFetch;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback silently
      }

      // Suppress external browser extension script errors from bubbling to app error handlers
      window.addEventListener(
        'error',
        function (event) {
          if (
            (event.filename && event.filename.startsWith('chrome-extension://')) ||
            (event.message && event.message.includes('fetch of #<Window> which has only a getter'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
